<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starlink VIP - المنصة الرسمية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background: #0b0f19; color: #fff; direction: rtl; text-align: right; }
        .container { max-width: 450px; margin: 40px auto; padding: 20px; background: #151b2b; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #00d2ff; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #b0c4de; }
        input { width: 100%; padding: 12px; border: 1px solid #2a3b5e; background: #0b0f19; color: #fff; border-radius: 8px; font-size: 16px; }
        input:focus { border-color: #00d2ff; outline: none; }
        button { width: 100%; padding: 12px; background: #00d2ff; border: none; color: #0b0f19; font-weight: bold; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #00a8cc; }
        .switch-btn { background: transparent; color: #00d2ff; border: none; margin-top: 15px; cursor: pointer; text-decoration: underline; width: 100%; text-align: center; }
        .hidden { display: none; }
        .admin-box { margin-top: 20px; background: #1e293b; padding: 15px; border-radius: 8px; }
        .user-card { background: #0b0f19; padding: 10px; margin-bottom: 10px; border-radius: 6px; border-right: 4px solid #00d2ff; }
        .alert { text-align: center; margin-top: 10px; font-size: 14px; color: #ff4d4d; }
    </style>
</head>
<body>

    <div class="container">
        <!-- قسم تسجيل الحساب / الدخول -->
        <div id="auth-section">
            <h2 id="form-title">تسجيل حساب جديد - Starlink VIP</h2>
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="example@gmail.com">
            </div>
            <div class="form-group">
                <label>رقم الهاتف</label>
                <input type="tel" id="phone" placeholder="05xxxxxxxx">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" placeholder="********">
            </div>
            <button id="action-btn" onclick="handleAuth()">إنشاء الحساب الآن</button>
            <button class="switch-btn" onclick="toggleMode()">لديك حساب بالفعل؟ سجل الدخول</button>
            <div id="error-msg" class="alert"></div>
        </div>

        <!-- لوحة التحكم للمستخدم المسجل -->
        <div id="dashboard-section" class="hidden">
            <h2>مرحباً بك في منصة Starlink VIP</h2>
            <p style="margin-bottom: 15px; text-align: center; color: #00d2ff;" id="user-info"></p>
            <div style="background: #1e293b; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 15px;">
                <p>رابط الإحالة الخاص بك:</p>
                <input type="text" id="ref-link" readonly style="text-align: center; margin-top: 5px; background: #0b0f19; color: #00d2ff;" value="https://starlink-vip.com/?ref=user">
            </div>
            <button onclick="logout()" style="background: #ff4d4d; color: #fff;">تسجيل الخروج</button>
        </div>

        <!-- لوحة تحكم الأدمن (تظهر فقط لإيميلك) -->
        <div id="admin-panel" class="hidden admin-box">
            <h3 style="color: #00d2ff; margin-bottom: 10px; text-align: center;">لوحة تحكم الأدمن (المشتركون)</h3>
            <div id="users-list">جاري تحميل المشتركين...</div>
        </div>
    </div>

    <!-- سكربتات فايربيس وترابط النظام المأخوذة من مشروعك -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-analytics.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDocs } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDUxppYtj_xAR1ZoIWOKtQ...tDQmrSC-hXciFg",
            authDomain: "starlink-vip.firebaseapp.com",
            projectId: "starlink-vip",
            storageBucket: "starlink-vip.appspot.com",
            messagingSenderId: "338468416205",
            appId: "1:338468416205:web:8cbaabe6b540d9784",
            measurementId: "G-PLHP6NC7XE"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const ADMIN_EMAIL = "ffwaz2748@gmail.com"; // إيميلك كأدمن

        let isLoginMode = false;
        window.toggleMode = function() {
            isLoginMode = !isLoginMode;
            document.getElementById("form-title").innerText = isLoginMode ? "تسجيل الدخول - Starlink VIP" : "تسجيل حساب جديد - Starlink VIP";
            document.getElementById("action-btn").innerText = isLoginMode ? "دخول إلى الحساب" : "إنشاء الحساب الآن";
            document.querySelector(".switch-btn").innerText = isLoginMode ? "ليس لديك حساب؟ إنشاء حساب جديد" : "لديك حساب بالفعل؟ سجل الدخول";
        }

        window.handleAuth = async function() {
            const email = document.getElementById("email").value;
            const phone = document.getElementById("phone").value;
            const password = document.getElementById("password").value;
            const errorMsg = document.getElementById("error-msg");

            errorMsg.innerText = "";
            if(!email || !password || (!isLoginMode && !phone)) {
                errorMsg.innerText = "يرجى تعبئة كافة الحقول المطلوبة!";
                return;
            }

            try {
                if(isLoginMode) {
                    await signInWithEmailAndPassword(auth, email, password);
                } else {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;
                    await setDoc(doc(db, "users", user.uid), {
                        email: email,
                        phone: phone,
                        createdAt: new Date().toISOString()
                    });
                }
            } catch (error) {
                errorMsg.innerText = "خطأ: " + error.message;
            }
        }

        window.logout = function() {
            signOut(auth);
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById("auth-section").classList.add("hidden");
                document.getElementById("dashboard-section").classList.remove("hidden");
                document.getElementById("user-info").innerText = "الحساب: " + user.email;
                document.getElementById("ref-link").value = `https://starlink-vip.com/?ref=${user.uid}`;

                if(user.email === ADMIN_EMAIL) {
                    document.getElementById("admin-panel").classList.remove("hidden");
                    loadAdminData();
                }
            } else {
                document.getElementById("auth-section").classList.remove("hidden");
                document.getElementById("dashboard-section").classList.add("hidden");
                document.getElementById("admin-panel").classList.add("hidden");
            }
        });

        async function loadAdminData() {
            const listDiv = document.getElementById("users-list");
            listDiv.innerHTML = "جاري جلب المشتركين...";
            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                let html = "";
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    html += `<div class="user-card">
                        <p><strong>البريد:</strong> ${data.email}</p>
                        <p><strong>الهاتف:</strong> ${data.phone || 'غير متوفر'}</p>
                        <p style="font-size:11px; color:#888;">التاريخ: ${data.createdAt || ''}</p>
                    </div>`;
                });
                listDiv.innerHTML = html || "لا يوجد مشتركون بعد.";
            } catch(e) {
                listDiv.innerHTML = "خطأ في تحميل البيانات.";
            }
        }
    </script>
</body>
</html>
