<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starlink VIP - المنصة الرسمية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background: #0b0f19; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { max-width: 450px; width: 100%; background: #161b22; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: 1px solid #30363d; }
        h2 { text-align: center; color: #00d2ff; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #8b949e; }
        input { width: 100%; padding: 12px; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 6px; font-size: 16px; }
        input:focus { border-color: #00d2ff; outline: none; }
        button { width: 100%; padding: 12px; background: #238636; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #2ea043; }
        .switch-btn { background: transparent; color: #00d2ff; border: none; margin-top: 15px; cursor: pointer; width: 100%; font-size: 14px; }
        .switch-btn:hover { text-decoration: underline; }
        .hidden { display: none; }
        .admin-box { margin-top: 20px; background: #0d1117; padding: 15px; border-radius: 8px; border: 1px solid #30363d; }
        .user-card { background: #0b0f19; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #21262d; }
        .alert { text-align: center; color: #ff5555; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- قسم تسجيل الحساب / الدخول -->
        <div id="auth-section">
            <h2 id="form-title">تسجيل حساب جديد</h2>
            <div class="form-group">
                <label>البريد الإلكتروني أو رقم الهاتف</label>
                <input type="text" id="identifier" placeholder="أدخل البريد أو رقم الهاتف">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور">
            </div>
            <button id="action-btn" onclick="handleAuth()">إنشاء الحساب</button>
            <button class="switch-btn" onclick="toggleMode()">لديك حساب بالفعل؟ سجل الدخول</button>
            <div id="error-msg" class="alert"></div>
        </div>

        <!-- لوحة التحكم للمستخدم المسجل -->
        <div id="dashboard-section" class="hidden">
            <h2>مرحباً بك في منصة Starlink VIP</h2>
            <p style="margin-bottom: 15px; text-align: center; color: #8b949e;">تم تسجيل دخولك بنجاح</p>
            <div style="background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                <p>رابط الإحالة الخاص بك:</p>
                <input type="text" id="ref-link" readonly style="margin-top: 5px; background: #0f172a;">
            </div>
            <button onclick="logout()" style="background: #da3633;">تسجيل الخروج</button>
        </div>

        <!-- لوحة تحكم الادمن (تظهر فقط لإيميلك) -->
        <div id="admin-panel" class="hidden admin-box">
            <h3 style="color: #00d2ff; margin-bottom: 10px;">لوحة تحكم المشرف (Admin)</h3>
            <div id="users-list">جاري تحميل المشتركين...</div>
        </div>
    </div>

    <!-- سكربتات فايبريس وترابط النظام -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDUxppYtj_xAR1ZoIWOKtDQmrSC-hXciFg",
          authDomain: "starlink-vip.firebaseapp.com",
          projectId: "starlink-vip",
          storageBucket: "starlink-vip.firebasestorage.app",
          messagingSenderId: "338468416205",
          appId: "1:338468416205:web:8cbaabe1ba6c6b540d9784",
          measurementId: "G-PLHP6NC7XE"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const ADMIN_EMAIL = "ffwaz2748@gmail.com";

        let isLoginMode = false;
        window.toggleMode = function() {
            isLoginMode = !isLoginMode;
            document.getElementById("form-title").innerText = isLoginMode ? "تسجيل الدخول" : "تسجيل حساب جديد";
            document.getElementById("action-btn").innerText = isLoginMode ? "دخول" : "إنشاء الحساب";
            document.querySelector(".switch-btn").innerText = isLoginMode ? "ليس لديك حساب؟ سجل حساب جديد" : "لديك حساب بالفعل؟ سجل الدخول";
        }

        window.handleAuth = async function() {
            let identifier = document.getElementById("identifier").value.trim();
            const password = document.getElementById("password").value;
            const errorMsg = document.getElementById("error-msg");

            errorMsg.innerText = "";
            if (!identifier || !password) {
                errorMsg.innerText = "يرجى ملء جميع الحقول المطلوبة";
                return;
            }

            // إذا أدخل المستخدم رقماً وليس إيميل، نقوم بتحويله إلى إيميل وهمي ليتوافق مع نظام المصادقة
            let emailForAuth = identifier;
            if (!identifier.includes("@")) {
                emailForAuth = identifier + "@starlink.vip";
            }

            try {
                if (isLoginMode) {
                    await signInWithEmailAndPassword(auth, emailForAuth, password);
                } else {
                    const userCredential = await createUserWithEmailAndPassword(auth, emailForAuth, password);
                    const user = userCredential.user;
                    await setDoc(doc(db, "users", user.uid), {
                        loginId: identifier,
                        createdAt: new Date().toISOString()
                    });
                }
            } catch (error) {
                errorMsg.innerText = "خطأ: " + error.message;
            }
        }

        window.logout = function() {
            signOut(auth);
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById("auth-section").classList.add("hidden");
                document.getElementById("dashboard-section").classList.remove("hidden");
                document.getElementById("ref-link").value = `https://nzmkek44.github.io/starlink-vip/?ref=${user.uid}`;

                if(user.email === ADMIN_EMAIL || user.email.startsWith("ffwaz2748")) {
                    document.getElementById("admin-panel").classList.remove("hidden");
                    loadAdminData();
                }
            } else {
                document.getElementById("auth-section").classList.remove("hidden");
                document.getElementById("dashboard-section").classList.add("hidden");
                document.getElementById("admin-panel").classList.add("hidden");
            }
        });

        async function loadAdminData() {
            const listDiv = document.getElementById("users-list");
            listDiv.innerHTML = "جاري جلب المشتركين...";
            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                let html = "";
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    html += `<div class="user-card">
                        <p><strong>المستخدم:</strong> ${data.loginId}</p>
                        <p style="font-size: 11px; color: #8b949e;">التاريخ: ${data.createdAt}</p>
                    </div>`;
                });
                listDiv.innerHTML = html || "لا يوجد مشتركين بعد";
            } catch (e) {
                listDiv.innerHTML = "خطأ في جلب البيانات";
            }
        }
    </script>
</body>
</html>
